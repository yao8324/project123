<h1>封印厅 · 石、黄铜与缄默的光</h1>
<p>一段墙、一根柱、一块地面与一盏灯。保留既有哥特建筑语言，增加石作层次与近距离细节；暖光引导视线，紫色克制地点出封印。</p>
<p class="note">自主尝试，待 Client 决定采用。左图是依据 1.0.6 建场代码重建的局部结构参考，<strong>不是原关卡截图</strong>。两图使用相同展示相机与公共灯光，右图增加自身灯笼点光；完整战斗场景尚未接入。</p>
