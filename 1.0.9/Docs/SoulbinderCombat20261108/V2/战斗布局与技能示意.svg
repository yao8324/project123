<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#171e29"/><style>text{font-family:system-ui,sans-serif;fill:#eee;text-anchor:middle;font-size:18px}</style><text x="500" y="38" style="font-size:25px">五类同批登场 · Boss以召唤为核心</text><rect x="400" y="65" width="200" height="62" rx="12" fill="#65467d"/><text x="500" y="103">缚魂者：群体召唤</text><path d="M500 127 L190 180" fill="none" stroke="#b794dc" stroke-width="3"/><rect x="55" y="180" width="270" height="90" rx="10" fill="#303b4b"/><text x="190" y="213">西锚点</text><text x="190" y="246">砍刀兵 / 剑盾兵</text><path d="M500 127 L500 180" fill="none" stroke="#b794dc" stroke-width="3"/><rect x="365" y="180" width="270" height="90" rx="10" fill="#303b4b"/><text x="500" y="213">东锚点</text><text x="500" y="246">弓箭手</text><path d="M500 127 L810 180" fill="none" stroke="#b794dc" stroke-width="3"/><rect x="675" y="180" width="270" height="90" rx="10" fill="#303b4b"/><text x="810" y="213">北锚点</text><text x="810" y="246">重锤兵 / 幽灵</text><text x="500" y="315" style="fill:#dcbb81">同一帧生成五类 → 共同显形 → 错峰出手</text><text x="500" y="360">后续补召：只补缺员，存活者不复制；每类最多1只</text><text x="500" y="402">关闭锚点：停止对应补召；打断施法：取消本轮整批</text><text x="500" y="450">Boss仅保留“群体召唤”和“近身横扫”</text><text x="500" y="485" style="font-size:14px;fill:#aebbc9">战胜 → 军团回笼 → 控制台选择 → 保存 / 离场</text></svg>